<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Supremacy Baggy - Login">
  <title>Login • Supremacy Baggy</title>
  <style>
    :root{--bg:#000;--fg:#fff;--muted:#bfbfbf;--accent:#fff;--card:#111;--border:#222}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,'Noto Sans','Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol';}
    a{color:var(--fg);text-decoration:none}
    img{max-width:100%;display:block}
    .container{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;box-shadow:0 10px 30px rgba(255,255,255,0.04)}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .logo img{width:44px;height:44px;border-radius:6px;filter:grayscale(1) contrast(1.1)}
    h1{font-size:22px;margin:0 0 2px 0;letter-spacing:0.5px}
    p.sub{margin:0 0 20px 0;color:var(--muted);font-size:13px}
    label{display:block;font-size:12px;margin:14px 0 6px;color:#d9d9d9}
    input{width:100%;padding:12px 14px;border-radius:10px;background:#0a0a0a;border:1px solid #1c1c1c;color:var(--fg);outline:none}
    input:focus{border-color:#3a3a3a;box-shadow:0 0 0 4px rgba(255,255,255,0.04)}
    .btn{width:100%;padding:12px 16px;border-radius:10px;border:1px solid #fff;background:#fff;color:#000;font-weight:700;letter-spacing:.3px;margin-top:16px;cursor:pointer}
    .btn:hover{filter:brightness(.95)}
    .mutelink{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
    .error{color:#ffb3b3;background:#330; border:1px solid #552; padding:10px;border-radius:8px;display:none;margin-top:10px;font-size:12px}
    .topbar{position:fixed;inset:0 0 auto 0;height:56px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #111}
    .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.8px}
    .topbar img{width:32px;height:32px;border-radius:4px;filter:grayscale(1)}
    .spacer{height:56px}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="https://i.imgur.com/ZMOggly.png" alt="Supremacy Baggy logo"><span>SUPREMACY BAGGY</span></div>
    <a href="/paginahome.html" aria-label="Voltar para home">Home</a>
  </div>
  <div class="spacer"></div>
  <main class="container">
    <section class="card" role="form" aria-labelledby="title">
      <div class="logo">
        <img src="https://i.imgur.com/ZMOggly.png" alt="Logo Supremacy Baggy">
        <div>
          <h1 id="title">Entrar</h1>
          <p class="sub">Acesse com e-mail e senha</p>
        </div>
      </div>
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <button class="btn" id="loginBtn">Entrar</button>
      <div class="error" id="errorBox" role="alert"></div>
      <a class="mutelink" href="/paginahome.html">Continuar sem login</a>
    </section>
  </main>

  <script>
    // Firebase inline init per page
    const firebaseConfig = {
      apiKey: "AIzaSyCbGwo74XhjxyorPEvz3WHZgGV6BESGZw8",
      authDomain: "supbaggy.firebaseapp.com",
      databaseURL: "https://supbaggy-default-rtdb.firebaseio.com",
      projectId: "supbaggy",
      storageBucket: "supbaggy.firebasestorage.app",
      messagingSenderId: "304795544101",
      appId: "1:304795544101:web:5de2ecc82c07fd9fe42dcc"
    };

    const loadFirebase = async () => {
      if (!window.firebaseApp) {
        const app = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js");
        await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js")
        ]);
        window.firebaseApp = firebase.initializeApp(firebaseConfig);
        try { window.firebaseAnalytics = firebase.analytics(); } catch(e) {}
      }
      return window.firebaseApp;
    };

    const adminEmail = "supremacybaggy@gmail.com";
    const adminUidList = new Set([ // Optionally add known admin UID(s)
      // "UID_ADMIN_AQUI"
    ]);

    function isAdmin(user){
      return !!user && (user.email === adminEmail || adminUidList.has(user.uid));
    }

    function showError(msg){
      const box = document.getElementById('errorBox');
      box.textContent = msg; box.style.display = 'block';
    }

    (async function init(){
      await loadFirebase();
      document.getElementById('loginBtn').addEventListener('click', async ()=>{
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        document.getElementById('errorBox').style.display='none';
        try{
          await firebase.auth().signInWithEmailAndPassword(email, password);
          const user = firebase.auth().currentUser;
          if (user) {
            const params = new URLSearchParams(location.search);
            const redirect = params.get('redirect') || '/paginahome.html';
            location.href = redirect;
          }
        }catch(err){
          showError(err && err.message ? err.message : 'Falha no login');
        }
      });

      firebase.auth().onAuthStateChanged((user)=>{
        try { firebaseAnalytics.logEvent('login_view'); } catch(e) {}
        if (user) {
          // Already logged in
        }
      });
    })();
  </script>
</body>
</html>
