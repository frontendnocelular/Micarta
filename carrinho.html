<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carrinho • Supremacy Baggy</title>
  <meta name="description" content="Carrinho de compras">
  <style>
    :root{--bg:#000;--fg:#fff;--muted:#bfbfbf;--card:#0b0b0b;--border:#151515}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Inter,system-ui}
    a{color:#fff;text-decoration:none}
    .top{position:fixed;inset:0 0 auto 0;height:56px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #111;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.8px}
    .brand img{width:32px;height:32px;border-radius:4px;filter:grayscale(1)}
    .menu-btn{width:40px;height:40px;border-radius:10px;border:1px solid #222;background:#0a0a0a;color:#fff;display:grid;place-items:center}
    .drawer{position:fixed;inset:56px 0 0 auto;width:80%;max-width:360px;background:#0a0a0a;border-left:1px solid #111;transform:translateX(100%);transition:transform .28s ease;z-index:20}
    .drawer.open{transform:translateX(0)}
    .drawer a{display:block;padding:16px;border-bottom:1px solid #111}
    .spacer{height:56px}
    .wrap{padding:16px;display:grid;gap:14px}
    .item{display:grid;grid-template-columns:88px 1fr;gap:10px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px}
    .item img{width:100%;height:100%;object-fit:cover;border-radius:8px}
    .title{font-weight:800}
    .muted{color:#bfbfbf}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .qty button{width:28px;height:28px;border-radius:8px;border:1px solid #222;background:#0a0a0a;color:#fff}
    .sum{padding:12px;border:1px solid var(--border);border-radius:12px;background:#0b0b0b}
    .buy{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #fff;background:#fff;color:#000;font-weight:900;margin-top:8px}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="https://i.imgur.com/ZMOggly.png" alt="Logo"><span>SUPREMACY BAGGY</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">≡</button>
  </header>
  <nav class="drawer" id="drawer" aria-label="Navegação">
    <a href="/paginahome.html">Home</a>
    <a href="/categorias.html">Categorias</a>
    <a href="/favoritos.html">Favoritos</a>
    <a href="/carrinho.html">Carrinho</a>
    <a href="/perfil.html">Perfil</a>
    <a href="/paineladmin.html" id="adminLink" style="display:none">Painel Admin</a>
    <a href="/login.html" id="loginLink">Entrar</a>
    <a href="#" id="logoutLink" style="display:none">Sair</a>
  </nav>
  <div class="spacer"></div>

  <main class="wrap">
    <h2 style="margin:8px 0 0 0;font-size:16px">Seu carrinho</h2>
    <div id="list"></div>
    <div class="sum">
      <div class="row"><span class="muted">Subtotal</span><span style="margin-left:auto" id="subtotal">R$ 0,00</span></div>
      <div class="row"><span class="muted">Fretes</span><span style="margin-left:auto" id="fretes">R$ 0,00</span></div>
      <div class="row"><strong>Total</strong><strong style="margin-left:auto" id="total">R$ 0,00</strong></div>
      <button class="buy" id="buyBtn">Fechar pelo WhatsApp</button>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCbGwo74XhjxyorPEvz3WHZgGV6BESGZw8",
      authDomain: "supbaggy.firebaseapp.com",
      databaseURL: "https://supbaggy-default-rtdb.firebaseio.com",
      projectId: "supbaggy",
      storageBucket: "supbaggy.firebasestorage.app",
      messagingSenderId: "304795544101",
      appId: "1:304795544101:web:5de2ecc82c07fd9fe42dcc"
    };
    const loadFirebase = async () => {
      if (!window.firebaseApp) {
        await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js");
        await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js")
        ]);
        window.firebaseApp = firebase.initializeApp(firebaseConfig);
        try { window.firebaseAnalytics = firebase.analytics(); } catch(e) {}
      }
      return window.firebaseApp;
    };
    const adminEmail = "supremacybaggy@gmail.com";
    function isAdmin(user){return !!user && user.email===adminEmail}
    document.getElementById('menuBtn').addEventListener('click', ()=>{
      document.getElementById('drawer').classList.toggle('open');
    });
    document.getElementById('logoutLink').addEventListener('click', async (e)=>{
      e.preventDefault(); await loadFirebase(); await firebase.auth().signOut(); location.reload();
    });

    function money(n){return 'R$ '+Number(n||0).toFixed(2)}
    function itemFrete(p){ return p.frete?.tipo==='fixo'? Number(p.frete.valor||0) : 0; }
    function freteLabel(p){ return p.frete?.tipo==='fixo'? ('R$'+Number(p.frete.valor||0).toFixed(2)) : (p.frete?.tipo==='gratis'? 'grátis' : 'a determinar'); }

    (async function(){
      await loadFirebase();
      const db = firebase.database();
      const user = await new Promise(res=>firebase.auth().onAuthStateChanged(res));
      if (!user){ location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.hash); return; }
      document.getElementById('loginLink').style.display='none';
      document.getElementById('logoutLink').style.display='block';
      document.getElementById('adminLink').style.display= isAdmin(user)?'block':'none';

      const cartRef = db.ref('users/'+user.uid+'/cart');
      const list = document.getElementById('list');
      let cacheProducts = {};
      const productsRef = db.ref('products');
      productsRef.on('value', s=>{ cacheProducts = s.val()||{}; });

      const recalc = (items)=>{
        let subtotal=0, fretes=0; list.innerHTML='';
        Object.entries(items||{}).forEach(([id, item])=>{
          const p = cacheProducts[id]; if (!p) return;
          const line = document.createElement('div'); line.className='item';
          const img = (p.images&&p.images[0])||'https://i.imgur.com/ZMOggly.png';
          line.innerHTML = `
            <div><img src='${img}' alt='${p.title}' loading='lazy'></div>
            <div>
              <div class='title'>${p.title}</div>
              <div class='muted'>${[item.tamanho,item.cor].filter(Boolean).join(' / ')}</div>
              <div class='row' style='margin-top:6px'>
                <div class='qty'>
                  <button data-id='${id}' data-delta='-1'>-</button>
                  <span>${item.qtd||1}</span>
                  <button data-id='${id}' data-delta='1'>+</button>
                </div>
                <span style='margin-left:auto'>${money(p.price)}</span>
              </div>
            </div>`;
          list.appendChild(line);
          subtotal += Number(p.price)*(item.qtd||1);
          fretes += itemFrete(p);
        });
        document.getElementById('subtotal').textContent = money(subtotal);
        document.getElementById('fretes').textContent = money(fretes);
        document.getElementById('total').textContent = money(subtotal+fretes);
      };

      cartRef.on('value', s=>{ recalc(s.val()); });

      list.addEventListener('click', (e)=>{
        const btn = e.target.closest('button[data-id]'); if(!btn) return;
        const id = btn.getAttribute('data-id'); const delta = Number(btn.getAttribute('data-delta'));
        cartRef.child(id).transaction(cur=>{ cur = cur||{qtd:1}; cur.qtd = Math.max(1,(cur.qtd||1)+delta); return cur; });
      });

      document.getElementById('buyBtn').onclick=async()=>{
        const s = await cartRef.get(); const items = s.val()||{}; if(!Object.keys(items).length){alert('Carrinho vazio'); return;}
        let msg = 'Pedido Supremacy Baggy\n'; let subtotal=0, fretes=0;
        for(const [id, item] of Object.entries(items)){
          const p = cacheProducts[id]; if(!p) continue;
          const linha = `\n- ${p.title} (${[item.tamanho,item.cor].filter(Boolean).join(' / ')}) x${item.qtd||1} — ${money(p.price)}`;
          msg += linha; subtotal += Number(p.price)*(item.qtd||1); fretes += itemFrete(p);
        }
        msg += `\n\nSubtotal: ${money(subtotal)}\nFretes: ${money(fretes)}\nTotal: ${money(subtotal+fretes)}`;
        try { firebaseAnalytics.logEvent('purchase_intent', {value: subtotal+fretes}); } catch(e) {}
        location.href='https://wa.me/559781084662?text='+encodeURIComponent(msg);
      };
    })();
  </script>
</body>
</html>
